spring:
  application:
    name: interface-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:mysql://127.0.0.1:3306/interface_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${PLATFORM_DB_USERNAME:root}
    password: ${PLATFORM_DB_PASSWORD:}
    driver-class-name: ${PLATFORM_DB_DRIVER:com.mysql.cj.jdbc.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  file:
    name: logs/interface-platform.log
  level:
    root: INFO
    com.lzcer.interfaceplatform: INFO

platform:
  security:
    encryption-key: ${PLATFORM_ENCRYPTION_KEY:}
    jwt-key: ${PLATFORM_JWT_KEY:${PLATFORM_ENCRYPTION_KEY:}}
    jwt-expire-minutes: ${PLATFORM_JWT_EXPIRE_MINUTES:120}
    signature-skew-seconds: ${PLATFORM_SIGNATURE_SKEW_SECONDS:300}
    bootstrap-admin-username: ${PLATFORM_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${PLATFORM_ADMIN_PASSWORD:}
    bootstrap-admin-name: ${PLATFORM_ADMIN_NAME:系统管理员}
  forward:
    max-body-bytes: 1048576
    max-log-summary-chars: 16000
  sql:
    max-rows-ceiling: 5000
    timeout-seconds-ceiling: 60
